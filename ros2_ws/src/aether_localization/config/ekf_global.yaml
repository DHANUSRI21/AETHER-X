ekf_filter_node_map:
  ros__parameters:
    frequency: 30.0
    sensor_timeout: 0.1
    two_d_mode: true

    publish_tf: false
    print_diagnostics: true
    debug: false

    map_frame: map
    odom_frame: odom
    base_link_frame: base_footprint
    world_frame: map

    # Wheel odometry
    odom0: /diff_drive_controller/odom
    odom0_config: [
      true, true, false,
      false, false, true,
      true, false, false,
      false, false, true,
      false, false, false
    ]
    odom0_queue_size: 10
    odom0_differential: false
    odom0_relative: false

    # GPS transformed into local Cartesian coordinates
    odom1: /odometry/gps
    odom1_config: [
      true, true, false,
      false, false, false,
      false, false, false,
      false, false, false,
      false, false, false
    ]
    odom1_queue_size: 10
    odom1_differential: false
    odom1_relative: false

    # Gyroscope Z only
    imu0: /aether/sensors/imu
    imu0_config: [
      false, false, false,
      false, false, false,
      false, false, false,
      false, false, true,
      false, false, false
    ]
    imu0_queue_size: 50
    imu0_differential: false
    imu0_relative: false
    imu0_remove_gravitational_acceleration: false
