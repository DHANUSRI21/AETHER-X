navsat_transform_node:
  ros__parameters:
    frequency: 10.0
    delay: 0.0

    zero_altitude: true
    publish_filtered_gps: true

    use_odometry_yaw: true
    wait_for_datum: true

    # Latitude, longitude, heading (radians)
    datum: [49.4431, 1.0993, 0.0]

    use_local_cartesian: true
    broadcast_cartesian_transform: false
