joint_state_broadcaster:
  ros__parameters:
    joints:
      - front_left_wheel_joint
      - rear_left_wheel_joint
      - front_right_wheel_joint
      - rear_right_wheel_joint

    interfaces:
      - position
      - velocity

    use_urdf_to_filter: false

controller_manager:
  ros__parameters:
    update_rate: 100
    enforce_command_limits: true

    joint_state_broadcaster:
      type: joint_state_broadcaster/JointStateBroadcaster

    diff_drive_controller:
      type: diff_drive_controller/DiffDriveController

diff_drive_controller:
  ros__parameters:

    # Four-wheel differential drive
    left_wheel_names:
      - front_left_wheel_joint
      - rear_left_wheel_joint

    right_wheel_names:
      - front_right_wheel_joint
      - rear_right_wheel_joint

    # Physical dimensions
    wheel_separation: 0.44
    wheel_radius: 0.08

    wheel_separation_multiplier: 1.0
    left_wheel_radius_multiplier: 1.0
    right_wheel_radius_multiplier: 1.0

    # Feedback and odometry
    position_feedback: true
    open_loop: false
    enable_odom_tf: true

    odom_frame_id: odom
    base_frame_id: base_footprint

    publish_rate: 50.0
    velocity_rolling_window_size: 10
    cmd_vel_timeout: 0.5
    publish_limited_velocity: true

    pose_covariance_diagonal:
      - 0.01
      - 0.01
      - 1000000.0
      - 1000000.0
      - 1000000.0
      - 0.02

    twist_covariance_diagonal:
      - 0.01
      - 0.01
      - 1000000.0
      - 1000000.0
      - 1000000.0
      - 0.02

    # Linear velocity limits
    linear.x.max_velocity: 0.8
    linear.x.min_velocity: -0.5

    # Angular velocity limits
    angular.z.max_velocity: 1.5
    angular.z.min_velocity: -1.5
